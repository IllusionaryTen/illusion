<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Illusion — social card</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#05070F;color:#F0F3FF;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    position:relative;padding:72px 80px;display:flex;flex-direction:column;justify-content:center;
  }
  .glow{position:absolute;inset:0;background:
    radial-gradient(720px 520px at 76% 30%,rgba(91,124,255,.32),transparent 62%),
    radial-gradient(500px 420px at 12% 88%,rgba(91,124,255,.14),transparent 60%);}
  .checker{position:absolute;inset:0;background-image:conic-gradient(rgba(255,255,255,.06) 25%,transparent 0 50%,rgba(255,255,255,.06) 0 75%,transparent 0);background-size:64px 64px;opacity:.55;mask-image:radial-gradient(720px 540px at 80% 50%,#000,transparent 75%)}
  .ring{position:absolute;border:1.5px solid rgba(124,152,255,.4);border-radius:50%;transform:rotate(-24deg)}
  .ring1{width:860px;height:360px;right:-190px;top:90px}
  .ring2{width:640px;height:260px;right:-80px;top:150px;border-color:rgba(124,152,255,.22)}
  .content{position:relative;z-index:2;max-width:760px}
  .brand{display:flex;align-items:center;gap:20px}
  .mark{width:64px;height:64px;color:#6E8CFF}
  .name{font-size:44px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
  h1{font-size:72px;line-height:1.02;letter-spacing:-.035em;font-weight:800;margin-top:40px}
  .grad{background:linear-gradient(93deg,#fff 0%,#DCE4FF 32%,#A9BEFF 68%,#6E8CFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin-top:24px;font-size:24px;color:#A6B3D0;line-height:1.5;max-width:640px}
  .meta{margin-top:36px;display:flex;gap:26px;font:600 15px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#7E8DB2}
  .meta span{display:flex;align-items:center;gap:10px}
  .dot{width:6px;height:6px;border-radius:50%;background:#5B7CFF;box-shadow:0 0 14px 3px rgba(91,124,255,.7)}
  .domain{position:absolute;right:80px;bottom:56px;z-index:2;font:600 16px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em;color:#8FA0C8}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="checker"></div>
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="content">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="3.6">
          <ellipse cx="32" cy="32" rx="29" ry="13" transform="rotate(-24 32 32)"/>
          <ellipse cx="32" cy="32" rx="22" ry="9.5" transform="rotate(-24 32 32)"/>
        </g>
        <rect x="32" y="32" width="15" height="15" transform="rotate(45 32 32)" fill="#fff"/>
      </svg>
      <span class="name">Illusion</span>
    </div>
    <h1>Private by design.<br><span class="grad">Personal by nature.</span></h1>
    <p>Encrypted messages, files and voice notes. Disappearing chats, ten aura themes — on Windows, Android, the web and Telegram.</p>
    <div class="meta">
      <span><i class="dot"></i>End-to-end encrypted</span>
      <span>34 languages</span>
      <span>Free</span>
    </div>
  </div>
  <div class="domain">illusionary.my.id</div>
</body>
</html>
